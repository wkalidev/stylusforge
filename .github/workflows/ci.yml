name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Pull requests share one group per branch, so a new push cancels the checks it supersedes. Each
# push to main gets its own group (keyed by commit): GitHub keeps only one pending run per group,
# so a shared group could drop a queued merge's run even without cancelling.
concurrency:
  group: ${{ github.event_name == 'push' && format('ci-{0}-{1}', github.ref, github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Production builds refuse to start without a WalletConnect project id. The build does not
      # call WalletConnect, so a placeholder is enough unless a repository variable sets one.
      NEXT_PUBLIC_WALLETCONNECT_ID: ${{ vars.NEXT_PUBLIC_WALLETCONNECT_ID || 'ci-build-placeholder' }}
      HARDHAT_DISABLE_TELEMETRY_PROMPT: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test (contracts, then web)
        run: pnpm test

      - name: Build web app
        run: pnpm build

  rust-lessons:
    name: Rust lesson checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The exporter reads the lessons from the web app; the contracts are not needed.
      - name: Install
        run: pnpm install --frozen-lockfile --filter web

      # curriculum/rust/rust-toolchain.toml pins the toolchain of both check crates.
      - name: Install the Rust toolchain
        working-directory: curriculum/rust
        run: rustup toolchain install

      # Caches the cargo registry and both target directories, keyed on the lockfiles and rustc.
      # Only main saves, so pull requests reuse its cache instead of each storing their own.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            curriculum/rust/stylus
            curriculum/rust/openzeppelin
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Export lesson Rust
        run: pnpm --filter web export:rust "$RUNNER_TEMP/lesson-rust"

      - name: cargo check and test lesson Rust
        run: curriculum/rust/check.sh "$RUNNER_TEMP/lesson-rust"
