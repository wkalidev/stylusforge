name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Production builds refuse to start without a WalletConnect project id. The build does not
      # call WalletConnect, so a placeholder is enough unless a repository variable sets one.
      NEXT_PUBLIC_WALLETCONNECT_ID: ${{ vars.NEXT_PUBLIC_WALLETCONNECT_ID || 'ci-build-placeholder' }}
      HARDHAT_DISABLE_TELEMETRY_PROMPT: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test (contracts, then web)
        run: pnpm test

      - name: Build web app
        run: pnpm build
