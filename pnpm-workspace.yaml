packages:
  - 'apps/*'
  - 'contracts'
onlyBuiltDependencies:
  - esbuild
ignoredBuiltDependencies:
  - bufferutil
  - keccak
  - sharp
  - unrs-resolver
  - utf-8-validate
overrides:
  # cdp-sdk >=1.53 statically imports optional @x402/* peers that break the Next.js build
  '@coinbase/cdp-sdk': 1.52.0
  # cdp-sdk 1.52.0 pins axios to exactly 1.16.0, which has advisories fixed in 1.20.0 (#142).
  # Drop this once the cdp-sdk pin above goes and its own axios is patched.
  '@coinbase/cdp-sdk>axios': ^1.20.0
  # cuer 0.0.3 (RainbowKit's QR code) passes border: 0, which qr >=0.6 rejects ("invalid border=0").
  # Fixed upstream in wevm/cuer#11 but unreleased (wevm/cuer#12): drop this once cuer ships it.
  'cuer>qr': 0.5.5
