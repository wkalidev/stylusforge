packages:
  - 'apps/*'
  - 'contracts'
onlyBuiltDependencies:
  - esbuild
ignoredBuiltDependencies:
  - bufferutil
  - keccak
  - sharp
  - unrs-resolver
  - utf-8-validate
overrides:
